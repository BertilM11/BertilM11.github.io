<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3C46F0" />
  <meta name="description" content="Programas y juegos hechos por Bertil Raxon." />
  <title>Bertil Raxon</title>
  <link rel="icon" type="image/png" href="assets/icons/br-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/br-180.png" />
  <link rel="preload" href="assets/fonts/lilita-one-400.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Plan: página-índice estilo sticker; encabezado con monograma y nombre, debajo una grilla de tarjetas (una por programa) con contorno de tinta y sombra dura. */
    @font-face{font-family:"Lilita One";font-weight:400;font-display:swap;src:url(assets/fonts/lilita-one-400.woff2) format("woff2")}
    @font-face{font-family:"Nunito";font-weight:700;font-display:swap;src:url(assets/fonts/nunito-700.woff2) format("woff2")}
    @font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(assets/fonts/nunito-800.woff2) format("woff2")}
    @font-face{font-family:"Nunito";font-weight:900;font-display:swap;src:url(assets/fonts/nunito-900.woff2) format("woff2")}
    :root{
      color-scheme:light;
      --paper:#FFFDF6;
      --ink:#1A1446;
      --stage:#3C46F0;
      --sun:#FFD43B;
      --pop:#FF4F8B;
      --muted:#5D5885;
      --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
      --body:"Nunito",ui-rounded,"Arial Rounded MT Bold",-apple-system,system-ui,sans-serif;
      --bw:3px;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;font-family:var(--body);font-weight:700;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(rgba(26,20,70,.08) 1.6px,transparent 2px);background-size:22px 22px}
    a{color:inherit}
    a:focus-visible,button:focus-visible{outline:3px solid var(--stage);outline-offset:3px}
    .wrap{max-width:1040px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}

    .hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:44px}
    .mono{width:92px;height:92px;flex:none;display:grid;place-items:center;border:var(--bw) solid var(--ink);border-radius:24px;background:var(--stage);box-shadow:6px 6px 0 var(--ink);transform:rotate(-5deg);font-family:var(--display);font-size:44px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
    .hero h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(46px,8vw,78px);line-height:.95;letter-spacing:.5px;text-shadow:5px 5px 0 var(--sun);text-wrap:balance}
    .hero p{margin:10px 0 0;font-size:clamp(17px,2.2vw,20px);font-weight:800;color:var(--muted);max-width:34em;line-height:1.4}

    .apps h2{margin:0 0 18px;font-family:var(--display);font-weight:400;font-size:28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
    .app{display:flex;flex-direction:column;gap:14px;padding:20px;border:var(--bw) solid var(--ink);border-radius:24px;background:#fff;box-shadow:7px 7px 0 var(--ink)}
    .appTop{display:flex;align-items:center;gap:16px}
    .appTop img{width:76px;height:76px;flex:none;border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:3px 3px 0 var(--ink);display:block}
    .app h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05}
    .app p{margin:0;font-size:16px;line-height:1.45;color:var(--ink)}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}
    .tags li{border:2px solid var(--ink);border-radius:30px;padding:3px 11px;font-size:13px;font-weight:900;background:var(--paper)}
    .open{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:10px 20px;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--sun);box-shadow:4px 4px 0 var(--ink);font-family:var(--display);font-size:22px;text-decoration:none;transition:transform .08s ease,box-shadow .08s ease}
    .open:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

    footer{margin-top:56px;font-size:14px;font-weight:800;color:var(--muted)}
    @media (max-width:520px){.hero{gap:16px}.mono{width:72px;height:72px;font-size:34px;border-radius:18px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="mono" aria-hidden="true">BR</div>
      <div>
        <h1>Bertil Raxon</h1>
        <p>Mis programas y juegos, listos para abrir desde cualquier dispositivo.</p>
      </div>
    </header>

    <section class="apps" aria-labelledby="appsTitle">
      <h2 id="appsTitle">Programas</h2>
      <div class="grid">
        <article class="app">
          <div class="appTop">
            <img src="casino-del-caos/icons/icon-192.png" alt="" width="76" height="76" />
            <h3>Casino del Caos</h3>
          </div>
          <p>Estación de juego con cartas de reto al azar, tiempo por equipo y marcador para cinco equipos.</p>
          <ul class="tags" aria-label="Características">
            <li>Juego</li><li>iPad y celular</li><li>Funciona sin internet</li>
          </ul>
          <a class="open" href="casino-del-caos/">Abrir</a>
        </article>
      </div>
    </section>

    <footer>© <span id="year">2026</span> Bertil Raxon</footer>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>

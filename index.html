<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6FA" />
  <meta name="description" content="Programas y juegos hechos por Bertil Raxon." />
  <title>Bertil Raxon</title>
  <link rel="icon" type="image/png" href="assets/icons/br-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/br-180.png" />
  <link rel="preload" href="assets/fonts/nunito-900.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Plan: página limpia y clara; encabezado con monograma y nombre grande, lista de programas en tarjetas sobrias con un solo acento azul. */
    @font-face{font-family:"Nunito";font-weight:700;font-display:swap;src:url(assets/fonts/nunito-700.woff2) format("woff2")}
    @font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(assets/fonts/nunito-800.woff2) format("woff2")}
    @font-face{font-family:"Nunito";font-weight:900;font-display:swap;src:url(assets/fonts/nunito-900.woff2) format("woff2")}
    :root{
      color-scheme:light;
      --bg:#F6F6FA;
      --card:#FFFFFF;
      --ink:#16142B;
      --muted:#6B6880;
      --line:#E4E2EE;
      --accent:#3C46F0;
      --body:"Nunito",ui-rounded,-apple-system,system-ui,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
    .wrap{max-width:960px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}

    .hero{display:flex;align-items:center;gap:18px;margin-bottom:56px}
    .mono{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:18px;background:var(--accent);color:#fff;font-weight:900;font-size:26px;letter-spacing:.5px;box-shadow:0 8px 20px rgba(60,70,240,.28);transform:rotate(-4deg)}
    .hero h1{margin:0;font-size:clamp(34px,6vw,52px);font-weight:900;line-height:1;letter-spacing:-.5px}
    .hero p{margin:8px 0 0;font-size:17px;color:var(--muted);font-weight:700}

    .apps h2{margin:0 0 16px;font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.3px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
    .app{display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 2px 6px rgba(22,20,43,.04);text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
    .app:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(22,20,43,.10);border-color:#D2D0E2}
    .appTop{display:flex;align-items:center;gap:14px}
    .appTop img{width:60px;height:60px;flex:none;border-radius:16px;display:block}
    .app h3{margin:0;font-size:21px;font-weight:900;line-height:1.15}
    .app .kind{display:block;margin-top:3px;font-size:13px;color:var(--muted);font-weight:800}
    .app p{margin:0;font-size:15px;line-height:1.5;color:#3E3B55}
    .open{display:inline-flex;align-items:center;justify-content:center;gap:8px;align-self:flex-start;margin-top:2px;padding:10px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;font-size:15px}
    .app:hover .open{background:#2F38D6}
    footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
    @media (max-width:520px){.wrap{padding-top:calc(32px + env(safe-area-inset-top))}.hero{margin-bottom:40px}.mono{width:54px;height:54px;font-size:22px;border-radius:15px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="mono" aria-hidden="true">BR</div>
      <div>
        <h1>Bertil Raxon</h1>
        <p>Mis programas y juegos, listos para abrir desde cualquier dispositivo.</p>
      </div>
    </header>

    <section class="apps" aria-labelledby="appsTitle">
      <h2 id="appsTitle">Programas</h2>
      <div class="grid">
        <a class="app" href="casino-del-caos/">
          <div class="appTop">
            <img src="casino-del-caos/icons/icon-192.png" alt="" width="60" height="60" />
            <div><h3>Casino del Caos</h3><span class="kind">Juego por equipos</span></div>
          </div>
          <p>Cartas de reto al azar, tiempo por equipo y marcador en vivo. Funciona en iPad, celular y compu, también sin internet.</p>
          <span class="open">Abrir</span>
        </a>
      </div>
    </section>

    <footer>© <span id="year">2026</span> Bertil Raxon</footer>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>

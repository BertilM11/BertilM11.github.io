# Alternativa al proyecto incluido: `brew install xcodegen && xcodegen generate`
# (regenera AutoGPTWatch.xcodeproj a partir de este archivo).
name: AutoGPTWatch
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
packages:
  AutoGPTCore:
    path: Packages/AutoGPTCore
targets:
  AutoGPTWatch:
    type: application
    platform: iOS
    sources:
      - path: AutoGPTWatch
    dependencies:
      - package: AutoGPTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.autogptwatch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AutoGPT Watch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_ENTITLEMENTS: Config/AutoGPTWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  AutoGPTWatch:
    build:
      targets:
        AutoGPTWatch: all
    test:
      targets:
        - package: AutoGPTCore/AutoGPTCoreTests
